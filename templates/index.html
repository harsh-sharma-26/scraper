<!doctype html>
<html>
  <head>
    <title>Search Demo</title>
  </head>
  <body>
    <h2>Search Kuch Bhi</h2>

    <!-- Ye form data ko /search route par POST method se bhejega -->
    <form action="/search" method="POST">
      <input type="text" name="query" placeholder="Yahan likho..." />
      <button type="submit">Search</button>
    </form>

    <!-- Agar result mila hai to yaha dikhayenge -->
    {% if result %}
    <h3>Tumne search kiya: {{ result }}</h3>
    {% endif %}
  </body>
</html>
